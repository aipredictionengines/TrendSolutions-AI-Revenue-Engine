name: Pilot v0.1 CI
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline smoke test
        run: python -m revenue_engine.cli --dataset data/synthetic/discovery_001.json
